# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.globalintelli.zae_scin_new
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS4
          url: http://otegroup.server.com:44380
          client: '050'
        app:
          name: ZAE_SCIN_NEW
          description: Application For Customer Identification
          package: zote_abap
          transport: DS4K926800
        exclude:
          - /test/
