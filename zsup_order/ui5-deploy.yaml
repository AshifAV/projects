# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zsuporder
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS4
          url: http://otegroup.server.com:44300
          client: '050'
        app:
          name: ZSUP_ORDER
          description: Supervisor Order Application
          package: zote_abap
          transport: DS4K926819
        exclude:
          - /test/
