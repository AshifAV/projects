specVersion: "3.1"
metadata:
  name: com.globalintelli.zae_sfqc
type: application
framework:
  name: SAPUI5
  version: 1.102.8
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: 10.50.2.44
            client: "100"
            destination: MANUAL_INPUT
          - path: /resources/com/globalintelli/zae_flib
            destination: ISS-SH1
            url: ""
            pathPrefix: /sap/bc/ui5_ui5/sap/ZAE_FLIB
          - path: /resources/com/globalintelli/zae_flib
            destination: ISS-SH1
            url: ""
            pathPrefix: /sap/bc/ui5_ui5/sap/ZAE_FLIB
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.globalintelli.ZAE_SFQC
        ui5Theme: sap_horizon
